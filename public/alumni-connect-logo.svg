<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Background Halo Ring Gradient -->
    <linearGradient id="haloGradient" x1="25" y1="95" x2="175" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A0D2EB" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#C2C2EB" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#D0BDF4" stop-opacity="0.95" />
    </linearGradient>

    <!-- Left Leg 'A' Gradient (Clean Slate / Steel Blue) -->
    <linearGradient id="leftLegGrad" x1="45" y1="42" x2="95" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#48688E" />
      <stop offset="50%" stop-color="#5E86AB" />
      <stop offset="100%" stop-color="#7CA3C4" />
    </linearGradient>

    <!-- Right Leg 'A' Gradient (Soft Lilac / Royal Purple) -->
    <linearGradient id="rightLegGrad" x1="100" y1="45" x2="155" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B528D" />
      <stop offset="50%" stop-color="#8458B3" />
      <stop offset="100%" stop-color="#9E80C4" />
    </linearGradient>

    <!-- Student Arc Gradient -->
    <linearGradient id="studentArcGrad" x1="68" y1="100" x2="135" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B84A9" />
      <stop offset="100%" stop-color="#83AACB" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#494D5F" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Halo Ring -->
  <circle cx="100" cy="86" r="57" stroke="url(#haloGradient)" stroke-width="2.5" fill="none" opacity="0.85" />

  <!-- Sparkle Star (4-Pointed) -->
  <path d="M 134 57 Q 134 62 139 62 Q 134 62 134 67 Q 134 62 129 62 Q 134 62 134 57 Z" fill="#C0A9E2" opacity="0.95" />

  <!-- Stylized Left Leg of 'A' -->
  <path d="M 96 44 
           L 80 84 
           C 74 98, 64 114, 50 125 
           C 47 127, 44 128, 48 128
           C 57 128, 71 127.5, 82 126
           C 76 122, 72 116, 73 110
           L 83 83
           C 87 74, 93 54, 96 44 Z" 
        fill="url(#leftLegGrad)" />

  <!-- Stylized Right Leg of 'A' -->
  <path d="M 104 44 
           L 115 74 
           C 120 70, 126 71, 131 77
           C 137 84, 140 96, 143 114
           C 144 120, 148 123, 151 125
           C 143 125.5, 129 125.5, 119 125
           C 124 120, 124 113, 122 108
           C 118 97, 112 88, 105 82
           L 104 44 Z" 
        fill="url(#rightLegGrad)" />

  <!-- Mentor Figure (Purple) Head -->
  <circle cx="121" cy="72" r="7.5" fill="#8458B3" filter="url(#softShadow)" />

  <!-- Student Figure (Slate Blue) Head -->
  <circle cx="87" cy="91" r="6.8" fill="#6A97BD" filter="url(#softShadow)" />

  <!-- Connecting Bridge / Upward Arc -->
  <!-- White Negative Space Contour -->
  <path d="M 70 123 
           C 71 106, 85 94, 114 93 
           C 127 93, 134 98, 137 107 
           C 134 99, 123 95, 111 95 
           C 88 96, 76 108, 72 123 Z" 
        fill="#FFFFFF" />

  <!-- Blue Dynamic Swoosh -->
  <path d="M 71 125 
           C 72 108, 87 96, 115 95 
           C 128 95, 135 100, 137 109 
           C 134 103, 124 98, 113 98 
           C 88 98, 77 110, 73 125 Z" 
        fill="url(#studentArcGrad)" />

  <!-- Graduation Mortarboard Cap at Peak -->
  <g filter="url(#softShadow)">
    <!-- Skullcap Base -->
    <path d="M 87 42 C 87 46.5, 113 46.5, 113 42 Z" fill="#2E384D" />
    
    <!-- Diamond Top Rhombus -->
    <polygon points="100,28 125,35.5 100,43 75,35.5" fill="#3D4A63" />
    
    <!-- Center Button -->
    <circle cx="100" cy="35.5" r="1.5" fill="#5A6985" />
    
    <!-- Right Hanging Tassel -->
    <path d="M 100 35.5 Q 119 37.5 121 47" stroke="#252F42" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <polygon points="120,47 123,47 122,52 119,52" fill="#252F42" />
  </g>
</svg>
